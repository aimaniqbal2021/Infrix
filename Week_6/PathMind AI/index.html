<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrailPulse</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="map"></div>

<div id="panel">
    <div id="panel-inner">

        <div id="logo-row">
            <div id="logo-icon">
                <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                    <path d="M14 3L25 8.5V19.5L14 25L3 19.5V8.5L14 3Z" stroke="#FF6B35" stroke-width="2" fill="none"/>
                    <path d="M14 3L14 25M3 8.5L25 8.5M3 19.5L25 19.5" stroke="#FF6B35" stroke-width="1" opacity="0.4"/>
                    <circle cx="14" cy="14" r="3" fill="#FF6B35"/>
                </svg>
            </div>
            <div>
                <div id="logo-name">TrailPulse</div>
                <div id="logo-sub">Adventure Intelligence</div>
            </div>
        </div>

        <div id="search-wrap">
            <div id="search-box">
                <svg id="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <circle cx="6.5" cy="6.5" r="4.5" stroke="#8a8f9e" stroke-width="1.5"/>
                    <line x1="10" y1="10" x2="14" y2="14" stroke="#8a8f9e" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                <input id="search-input" type="text" placeholder="Search a place… e.g. Maldives" autocomplete="off"/>
                <div id="search-clear" style="display:none">✕</div>
            </div>
            <div id="suggestions"></div>
        </div>

        <div id="hint-card">
            <div id="hint-icon">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <circle cx="10" cy="10" r="8" stroke="#FF6B35" stroke-width="1.5"/>
                    <path d="M10 6v4l3 3" stroke="#FF6B35" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </div>
            <div id="hint-text">Search a place or click the map to explore adventures there.</div>
        </div>

        <div id="results-area"></div>

    </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="script.js"></script>

</body>
</html>
